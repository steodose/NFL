name: Refresh site

# Renders the R Markdown site and commits the output back to master,
# which is what GitHub Pages serves.
#
# Schedule: 03:00 America/Los_Angeles on Mon, Tue and Fri, to pick up the
# nflverse data refresh after each slate of games:
#   Fri - Thursday Night Football
#   Mon - Sunday games
#   Tue - Monday Night Football
#
# GitHub cron is UTC-only, so both candidate hours are registered and the
# gate job drops whichever one does not correspond to 03:00 Pacific today.
on:
  schedule:
    - cron: '0 10 * * 1,2,5'   # 03:00 PDT
    - cron: '0 11 * * 1,2,5'   # 03:00 PST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-site
  cancel-in-progress: false

jobs:
  # Only decides whether a SCHEDULED run is the 03:00 Pacific one. Manual runs
  # bypass this entirely via the render job's condition below, so a problem
  # here can never block a workflow_dispatch.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # Decide from the cron that TRIGGERED this run, never from the clock.
      # GitHub routinely starts scheduled runs hours after their nominal time
      # (observed here: 10:00 UTC crons starting at 14:06 and 14:41 UTC), so a
      # "is it 03:00 Pacific right now?" test is false for both candidates and
      # drops the whole day. github.event.schedule is the literal cron string
      # from the `on:` block above, so it identifies the intended slot no matter
      # how late the runner picks it up. A delayed run still renders - just late.
      - id: check
        env:
          TRIGGER: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          # Hour field of the triggering cron: 10 (the PDT entry) or 11 (PST).
          fired=$(echo "$TRIGGER" | awk '{print $2}')
          # DST only flips on a Sunday at 02:00 local; this workflow runs
          # Mon/Tue/Fri, so the offset now is the offset that was in force at
          # 03:00 Pacific this morning even when the run starts hours late.
          offset=$(TZ=America/Los_Angeles date +%z)
          if [ "$offset" = '-0700' ]; then
            want=10   # PDT
          else
            want=11   # PST
          fi
          if [ "$fired" = "$want" ]; then
            echo "Cron '$TRIGGER' is the 03:00 Pacific slot (offset $offset) - proceeding."
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo "Cron '$TRIGGER' is the off-DST duplicate (offset $offset wants hour $want). Skipping."
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
          echo "event=${{ github.event_name }} fired_hour=$fired want_hour=$want offset=$offset pacific_now=$(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M')"

  render:
    needs: gate
    # !cancelled() is required: `gate` is skipped on a manual run, and a skipped
    # dependency would otherwise skip this job too. Manual runs always render;
    # scheduled runs render only when the gate says this is the day's
    # 03:00 Pacific cron.
    if: >-
      !cancelled() &&
      (github.event_name != 'schedule' || needs.gate.outputs.run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Full history: the push step resets onto a freshly fetched master, which
      # is unreliable in a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # ggplot figures are drawn in Titillium Web and Outfit. knitr runs with
      # warning=FALSE, so a missing font substitutes silently rather than
      # failing - hence the explicit check below.
      - name: Install fonts
        run: |
          set -euo pipefail
          dir=~/.local/share/fonts
          mkdir -p "$dir"
          base=https://raw.githubusercontent.com/google/fonts/main
          for f in Regular Bold SemiBold Light; do
            curl -fsSL -o "$dir/TitilliumWeb-$f.ttf" \
              "$base/ofl/titilliumweb/TitilliumWeb-$f.ttf"
          done
          curl -fsSL -o "$dir/Outfit.ttf" "$base/ofl/outfit/Outfit%5Bwght%5D.ttf"
          fc-cache -f
          fc-list | grep -qi titillium || { echo 'Titillium Web missing'; exit 1; }
          fc-list | grep -qi outfit    || { echo 'Outfit missing'; exit 1; }
          echo 'Fonts registered.'

      # reactablefmtr is archived on CRAN, so it comes from source.
      # dependencies: hard installs only Depends/Imports/LinkingTo. The default
      # ("all") also pulls Suggests for every package named below, which fails
      # here: reactablefmtr suggests dataui, a GitHub-only package pak cannot
      # resolve from CRAN, and one unresolvable package aborts the whole solve.
      # The tables here use color_scales/embed_img/add_title, none of which need
      # dataui. Soft deps the render does rely on are named explicitly below:
      # gtExtras' gt_plt_bar_stack/gt_plt_winloss render inline plots via
      # ggsave(.svg) and need svglite, and reactable pulls in crosstalk. Both
      # load lazily at call time, so neither shows up as a library() call.
      # To re-check after adding charts: run render_site() locally, then diff
      # loadedNamespaces() against the hard-dependency closure of this list.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          dependencies: '"hard"'
          packages: |
            any::magick
            any::ragg
            any::systemfonts
            any::curl
            any::svglite
            any::crosstalk
            any::rmarkdown
            any::knitr
            any::tidyverse
            any::DBI
            any::RSQLite
            any::animation
            any::extrafont
            any::ggforce
            any::ggimage
            any::ggrepel
            any::ggsci
            any::ggtext
            any::glue
            any::gt
            any::gtExtras
            any::htmltools
            any::nflfastR
            any::nflreadr
            any::nflseedR
            any::nflplotR
            any::paletteer
            any::prismatic
            any::reactable
            any::scales
            any::teamcolors
            any::webshot
            any::webshot2
            github::kcuilla/reactablefmtr

      - name: Render site
        run: Rscript -e 'rmarkdown::render_site(encoding = "UTF-8")'

      # Forecast Simulations.Rmd rewrites Latest Game Predictions.csv and
      # Overall Predictions.csv on every render, so data files are committed
      # alongside the rendered HTML.
      # A plain `git push` fails if master moved between checkout and push
      # (a manual push, or an overlapping run). Everything committed here is
      # regenerated output, so the freshly rendered copy should always win:
      # rebase the working tree onto the current master and commit on top,
      # retrying in case master moves again mid-push.
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -z "$(git status --porcelain)" ]; then
            echo 'Nothing changed - not committing.'
            exit 0
          fi
          msg="Auto refresh site ($(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')) [skip ci]"
          git add -A
          git commit -m "$msg"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (master moved); rebasing and retrying."
            git fetch origin master
            # During a rebase "theirs" is the commit being replayed - this one -
            # so regenerated output wins any conflict, while files added by the
            # other push are preserved. Never use `git add -A` against a moved
            # master: it would stage deletions for files this run never had.
            if ! git rebase -X theirs origin/master; then
              git rebase --abort || true
              echo 'Could not rebase onto master.'
              exit 1
            fi
            if git diff --quiet origin/master HEAD; then
              echo 'Render matches current master - nothing left to push.'
              exit 0
            fi
          done
          echo 'Could not push after 5 attempts.'
          exit 1
