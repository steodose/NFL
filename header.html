<!-- Titillium Web is loaded as a webfont here rather than relied on as an
     installed system font. Safari restricts CSS access to locally installed
     fonts as a fingerprinting defence, so `font-family: Titillium Web` on the
     reactable tables resolved to nothing and fell back to the default serif
     (Times) for every visitor on Safari, including ones who have the font
     installed. Loading it from Google Fonts makes it available to every
     browser. This is included on every page via `_site.yml`. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap">
